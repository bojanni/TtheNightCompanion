name: Schema Drift Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  schema-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run schema drift check
        run: npm run schema:drift-check
